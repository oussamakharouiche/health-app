name: health_app
description: "Personal health companion: FODMAP-aware diet tracking, nutrition monitoring, training log, habit tracking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database (SQLite)
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.31
  drift_flutter: ^0.2.4

  # Key-value storage
  hive_flutter: ^1.1.0

  # HTTP (LLM API calls)
  http: ^1.3.0

  # Charts
  fl_chart: ^0.70.2

  # JSON serialization
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  intl: ^0.20.2
  go_router: ^14.8.1

  # File I/O and sharing
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7

  # UUID generation
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  drift_dev: ^2.25.1
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/seed_data/
